name: Infrastructure preview

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra-preview.yml'
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/infra-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    env:
      PULUMI_CONFIG_PASSPHRASE: local-preview
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: pulumi/actions@v7.0.0
        with:
          pulumi-version: '3.270.0'
      - name: Preview empty stack
        working-directory: infra
        run: |
          mkdir -p "$RUNNER_TEMP/pulumi-state"
          export PULUMI_BACKEND_URL="file://$RUNNER_TEMP/pulumi-state"
          pulumi stack init ci --non-interactive
          pulumi preview --stack ci --non-interactive
