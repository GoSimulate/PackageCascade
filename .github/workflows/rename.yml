name: Rename script

on:
  pull_request:
    paths:
      - 'scripts/rename_project.py'
      - 'scripts/test_rename_project.py'
      - '.github/workflows/rename.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/rename_project.py'
      - 'scripts/test_rename_project.py'
      - '.github/workflows/rename.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rename:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Test rename script
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build and test a renamed copy
        run: |
          mkdir -p "$RUNNER_TEMP/renamed-template"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/renamed-template"
          cd "$RUNNER_TEMP/renamed-template"
          python3 scripts/rename_project.py MotorDesign
          dotnet build src/MotorDesign.slnx -c Release
          dotnet run --project src/MotorDesign.Tests.Unit/MotorDesign.Tests.Unit.csproj -c Release --no-build --no-restore
          dotnet run --project src/MotorDesign.Tests.Integration/MotorDesign.Tests.Integration.csproj -c Release --no-build --no-restore
